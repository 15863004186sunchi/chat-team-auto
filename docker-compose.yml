version: '3.8'

services:
  abcard:
    build: .
    container_name: abcard-app
    ports:
      - "8503:8503"
    volumes:
      # config.json is NOT in git. Run ./prepare.sh first to create it.
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
